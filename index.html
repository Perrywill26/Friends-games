<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends Game 💕</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
    }

    .box {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 25px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    h1 {
      color: #ff4f75;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 12px;
      background: #ff4f75;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .room {
      font-size: 30px;
      font-weight: bold;
      color: #ff4f75;
      letter-spacing: 5px;
      margin: 15px;
    }

    .status {
      color: #666;
    }

    .numbers {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .number {
      padding: 15px 5px;
      background: #ff4f75;
      color: white;
      border-radius: 12px;
      font-weight: bold;
      font-size: 18px;
    }

    .question {
      display: none;
      margin: 20px 0;
      padding: 20px;
      border-radius: 15px;
      background: #fff0f4;
      font-size: 19px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <div id="home">
    <h1>Friends Game 💕</h1>
    <p>Play together online!</p>

    <button onclick="createRoom()">Create Room</button>

    <p>OR</p>

    <input id="roomInput" maxlength="6" placeholder="Enter room code">

    <button onclick="joinRoom()">Join Room</button>
  </div>


  <div id="room" class="hidden">
    <h1>Your Room 🎮</h1>

    <p>Send this code to your friend:</p>

    <div class="room" id="roomCode"></div>

    <p class="status" id="playerStatus">
      Waiting for another player...
    </p>

    <button id="startButton" class="hidden" onclick="startGame()">
      Start Game 🎮
    </button>
  </div>


  <div id="game" class="hidden">
    <h1>Pick a Number 💕</h1>

    <p class="status" id="gameStatus">
      Choose any number.
    </p>

    <div id="question" class="question"></div>

    <div class="numbers" id="numbers"></div>

    <button onclick="nextQuestion()">Next Question</button>
  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getDatabase,
    ref,
    set,
    get,
    update,
    onValue
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDOs7Nqud7xUXO32HDhJbkAOUDpQh--kHg",
    authDomain: "freinds-game-32dc5.firebaseapp.com",
    databaseURL: "https://freinds-game-32dc5-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "freinds-game-32dc5",
    storageBucket: "freinds-game-32dc5.firebasestorage.app",
    messagingSenderId: "443907752612",
    appId: "1:443907752612:web:09f2da7d2887ecf212dc31"
  };


  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let roomId = "";
  let playerId = "";


  const questions = [
    "What is one thing you really like about me? ❤️",
    "What was your first impression of me?",
    "What is your favourite memory with me?",
    "What always makes you smile?",
    "What would you like us to do together?",
    "What do you appreciate about me?",
    "Who usually starts the conversation?",
    "What is one funny memory about us? 😂",
    "Where would you like us to visit together?",
    "What is your favourite thing about our friendship?",
    "What do you enjoy talking about with me?",
    "What song reminds you of me?",
    "What have you always wanted to tell me?",
    "What makes you comfortable around someone?",
    "What do you think we have in common?",
    "What is your funniest memory?",
    "If we could hang out anywhere today, where?",
    "What do you hope we do together someday?",
    "What is your favourite way to spend time together?",
    "Describe me using three words."
  ];


  const numbers = document.getElementById("numbers");

  questions.forEach((q, i) => {

    const button = document.createElement("div");

    button.className = "number";
    button.textContent = i + 1;

    button.onclick = () => chooseNumber(i + 1);

    numbers.appendChild(button);

  });


  function makeRoomCode() {

    return Math.floor(
      100000 + Math.random() * 900000
    ).toString();

  }


  window.createRoom = async function() {

    roomId = makeRoomCode();
    playerId = "p1";

    await set(ref(db, "rooms/" + roomId), {

      p1: true,
      p2: false,
      status: "waiting",
      selectedNumber: null,
      selectedBy: null,
      question: ""

    });

    document.getElementById("home")
      .classList.add("hidden");

    document.getElementById("room")
      .classList.remove("hidden");

    document.getElementById("roomCode")
      .textContent = roomId;

    listenToRoom();

  };


  window.joinRoom = async function() {

    const code = document
      .getElementById("roomInput")
      .value
      .trim();

    if (code.length !== 6) {

      alert("Enter the 6-digit room code.");

      return;

    }

    const roomRef = ref(db, "rooms/" + code);
    const snapshot = await get(roomRef);

    if (!snapshot.exists()) {

      alert("Room not found.");

      return;

    }

    const room = snapshot.val();

    if (room.p2) {

      alert("This room already has two players.");

      return;

    }

    roomId = code;
    playerId = "p2";

    await update(roomRef, {
      p2: true,
      status: "ready"
    });

    document.getElementById("home")
      .classList.add("hidden");

    document.getElementById("room")
      .classList.remove("hidden");

    document.getElementById("roomCode")
      .textContent = roomId;

    listenToRoom();

  };


  function listenToRoom() {

    const roomRef = ref(db, "rooms/" + roomId);

    onValue(roomRef, (snapshot) => {

      if (!snapshot.exists()) return;

      const room = snapshot.val();

      if (room.p1 && room.p2) {

        document.getElementById("playerStatus")
          .textContent =
          "Both players are connected! 🎉";

        if (playerId === "p1") {

          document.getElementById("startButton")
            .classList.remove("hidden");

        }

      }

      if (room.status === "playing") {

        document.getElementById("room")
          .classList.add("hidden");

        document.getElementById("game")
          .classList.remove("hidden");

      }

      if (room.selectedNumber) {

        showQuestion(
          room.selectedNumber,
          room.question,
          room.selectedBy
        );

      }

    });

  }


  window.startGame = async function() {

    await update(
      ref(db, "rooms/" + roomId),
      {
        status: "playing"
      }
    );

  };


  window.chooseNumber = async function(number) {

    const question = questions[number - 1];

    await update(
      ref(db, "rooms/" + roomId),
      {
        selectedNumber: number,
        selectedBy: playerId,
        question: question
      }
    );

  };


  function showQuestion(number, question, selectedBy) {

    const box = document.getElementById("question");

    box.textContent =
      number + ". " + question;

    box.style.display = "block";

    const status =
      document.getElementById("gameStatus");

    if (selectedBy === playerId) {

      status.textContent =
        "You picked number " + number + " 😊";

    } else {

      status.textContent =
        "The other player picked number " + number + " 👀";

    }

  }


  window.nextQuestion = async function() {

    await update(
      ref(db, "rooms/" + roomId),
      {
        selectedNumber: null,
        selectedBy: null,
        question: ""
      }
    );

    document.getElementById("question")
      .style.display = "none";

    document.getElementById("gameStatus")
      .textContent = "Choose any number.";

  };

</script>

</body>
</html>
