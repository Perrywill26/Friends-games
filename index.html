<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two of Us — Online</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#171329,#3a1e50);min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#ffffff12;border:1px solid #ffffff25;border-radius:24px;padding:22px;backdrop-filter:blur(12px);box-shadow:0 18px 50px #0005}
h1{margin:0 0 6px}.muted{opacity:.75}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
input,button,select,textarea{font:inherit;border:0;border-radius:14px;padding:13px}input,select,textarea{background:#fff;color:#222;width:100%}button{cursor:pointer;font-weight:800;background:#fff;color:#241432}button.alt{background:#ffffff15;color:#fff;border:1px solid #ffffff25}
.hidden{display:none}.room{font-size:26px;font-weight:900;letter-spacing:3px;text-align:center;padding:12px;border-radius:15px;background:#0003;margin:12px 0}
.numgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.numgrid button{padding:12px;background:#ffffff12;color:#fff;border:1px solid #ffffff20}
.numgrid button.used{opacity:.3}.q{font-size:24px;font-weight:800;line-height:1.35;min-height:120px;display:flex;align-items:center}
.answer{background:#0003;border-radius:16px;padding:15px;margin-top:12px}.answer b{display:block;margin-bottom:5px}.status{padding:10px;border-radius:12px;background:#ffffff0d;margin:12px 0}
.small{font-size:12px;opacity:.65}.spacer{height:12px}
</style>
</head>
<body><div class="wrap">
<div class="card" id="home">
<h1>💜 Two of Us</h1><p class="muted">An online 2-player question game. Pick a number, answer its question, and your partner sees your answer.</p>
<div class="row"><input id="name" placeholder="Your name"><button onclick="createRoom()">Create room</button></div>
<div class="spacer"></div>
<div class="row"><input id="code" placeholder="Room code"><button class="alt" onclick="joinRoom()">Join room</button></div>
<p class="small">Tip: open this same page on both phones. The connection is peer-to-peer after the room is joined.</p>
</div>

<div class="card hidden" id="game">
<div class="row"><div><b id="me"></b><div class="small">You</div></div><div style="text-align:right"><b id="other">Waiting…</b><div class="small">Partner</div></div></div>
<div class="room" id="room"></div>
<div class="status" id="status">Choose a number.</div>
<select id="category"><option value="all">🎲 Any category</option><option value="past">🕰️ Past & childhood</option><option value="experience">🌱 Experiences</option><option value="feelings">❤️ Feelings</option><option value="personality">🧠 Personality</option><option value="relationships">💕 Crushes & relationships</option><option value="random">😂 Random</option><option value="future">🌍 Dreams & future</option><option value="would">⚡ Would you rather</option></select>
<div class="numgrid" id="numbers"></div>
<div class="q" id="question">Pick a number above.</div>
<div id="answerBox" class="answer hidden"></div>
<div id="respond" class="hidden"><textarea id="answer" rows="4" placeholder="Type your answer here…"></textarea><button onclick="sendAnswer()">Submit answer 💬</button></div>
<div class="spacer"></div><button class="alt" onclick="leave()">Leave room</button>
</div></div>
<script>
const Q={
past:["What is one of your earliest memories?","What were you like as a child?","What was your favourite childhood game?","What subject did you enjoy most in school?","What was your funniest school memory?","Who was your childhood best friend?","What is something you used to believe as a kid?","What childhood habit did you grow out of?","What cartoon did you love growing up?","What was your biggest childhood fear?","Did you ever get into funny trouble at school?","What achievement from childhood are you proud of?","What family tradition did you enjoy?","What did you dream of becoming when you were younger?","What childhood memory would you happily relive?","What was your most embarrassing school moment?","What is a lesson your childhood taught you?","What was your favourite birthday memory?","What did you enjoy doing on weekends as a child?","What would younger-you think of you now?"],
experience:["What experience changed the way you think?","What is a difficult decision you learned from?","What is something you tried once and would try again?","What is the most unexpected thing that happened to you?","What is a mistake that taught you a valuable lesson?","What is something you once disliked but now enjoy?","What is something you did that surprised yourself?","What is the bravest thing you've done?","What experience made you more confident?","Have you ever had to start over?","What is something you've learned the hard way?","What is one experience you would not repeat?","What is something you wish you'd handled differently?","What experience made you appreciate someone more?","When did you last feel really proud of yourself?","What is a challenge you overcame?","What is a new thing you'd like to try?","What experience taught you patience?","What is a place that gave you a great memory?","What is one life lesson you want to keep forever?"],
feelings:["What instantly makes you happy?","When do you feel most appreciated?","What is something you find difficult to say?","What makes you feel comfortable around someone?","How do you usually react when upset?","What do you wish people understood about you?","What kind of compliment means the most to you?","What are you grateful for right now?","What makes you feel understood?","Do you prefer talking immediately or taking time first?","What improves your mood quickly?","What feeling do you rarely show?","What makes you trust someone?","What are you proud of but rarely mention?","What kind of support helps you most?","What do you want more of in life?","What makes you nostalgic?","What would you tell your younger self?","What does happiness mean to you?","What is something that always cheers you up?"],
personality:["What three words describe you?","What is your best quality?","What habit would you like to change?","Are you spontaneous or planned?","What makes you different from most people you know?","What are you surprisingly good at?","What is your biggest pet peeve?","Do you forgive easily?","Heart or head when making decisions?","What do you overthink?","What are you like when fully comfortable?","What are you stubborn about?","What trait do you admire in others?","What do people misunderstand about you?","Are you competitive?","What do you never compromise on?","What makes you instantly comfortable with someone?","What is your biggest strength?","What is something you want to improve?","What kind of friend are you?"],
relationships:["Who was your first serious crush?","What was your first impression of someone you really liked?","What is the sweetest thing someone has done for you?","What relationship lesson have you learned?","Have you ever liked someone who did not know?","What makes you lose interest in someone?","What personality quality attracts you most?","What is a green flag you value?","What is a red flag you never ignore?","Have you ever liked someone at the wrong time?","What does a healthy relationship look like to you?","What do you need from someone you care about?","Have you ever regretted not saying how you felt?","What matters more: trust or chemistry? Why?","What did a past connection teach you?","How do you show someone you care?","What makes you feel appreciated?","What is your biggest relationship pet peeve?","What makes someone memorable to you?","What is one thing you would never tolerate in a relationship?"],
random:["What is your most useless talent?","What is the funniest nickname you've had?","What app do you spend too much time on?","What is the funniest thing you've seen recently?","What food could you eat for a week?","What is your most embarrassing autocorrect moment?","What song do you always sing along to?","What silly fear do you have?","Would you survive a week without your phone?","What is the strangest dream you remember?","If your life had a warning label, what would it say?","What fictional world would you live in?","What is the most random thing in your gallery?","If you became famous tomorrow, what would it be for?","What is something you find funny that others don't?","What ridiculous law would you create?","What is your funniest habit?","What is the weirdest food combination you like?","If you could instantly master one skill, what would it be?","What is one random fact you love?"],
future:["What is your biggest dream right now?","Where would you love to travel?","What career would you choose if money were irrelevant?","What kind of home would you like someday?","What do you want to achieve in the next few years?","What would your ideal day look like?","What skill do you want to learn?","What kind of life would make you fulfilled?","What do you hope never changes about you?","What place would you love to visit with someone special?","What motivates you when stuck?","What personal goal are you working toward?","What would you do if you knew you could not fail?","What is on your bucket list?","City life or quiet life? Why?","What do you want people to remember you for?","What would your ideal weekend look like?","What do you want to experience at least once?","What future achievement would make you proud?","What dream have you not told many people about?"],
would:["Would you rather know your future or change one thing from your past?","Would you rather travel the world or have your dream home?","Would you rather be extremely funny or extremely wise?","One best friend or many good friends?","Always early or exactly on time?","Lose social media for a month or music for a month?","Read minds or see the future?","Relive your best day or skip your worst day?","Unlimited travel or unlimited food?","Famous or completely unknown?","Perfect memory or never overthink again?","Ocean or mountains?","Heartfelt letter or thoughtful gift?","More time or more money?","Always say what you think or keep your thoughts private?","Dream job or unlimited free time?","Loved by many or deeply understood by one?","Speak every language or play every instrument?","Exciting life or peaceful life?","Fix one past mistake or guarantee one future success?"]};
let peer,conn,host=false,name="",room="",questions=[],chosen=-1,waiting=false;
function $(x){return document.getElementById(x)}
function makeId(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function setupPeer(id,cb){peer=new Peer(id);peer.on("open",()=>cb());peer.on("connection",c=>{if(host){conn=c;bind();conn.on("open",()=>{conn.send({t:"hello",name});});}});peer.on("error",e=>alert("Connection error. Try a new room code."))}
function createRoom(){name=$("name").value.trim()||"Player 1";host=true;room=makeId();setupPeer(room,()=>{showGame();$("room").textContent=room;$("status").textContent="Send this room code to your partner. Waiting for them…";})}
function joinRoom(){name=$("name").value.trim()||"Player 2";room=$("code").value.trim().toUpperCase();if(!room)return alert("Enter the room code.");host=false;setupPeer(makeId(),()=>{conn=peer.connect(room,{reliable:true});bind();conn.on("open",()=>{conn.send({t:"hello",name});showGame();$("room").textContent=room;$("status").textContent="Connected. Choose a number when it is your turn.";});})}
function bind(){conn.on("data",m=>receive(m))}
function showGame(){$("home").classList.add("hidden");$("game").classList.remove("hidden");$("me").textContent=name;buildNumbers()}
function buildNumbers(){let g=$("numbers");g.innerHTML="";for(let i=1;i<=20;i++){let b=document.createElement("button");b.textContent=i;b.onclick=()=>pick(i);b.id="n"+i;g.appendChild(b)}}
function pool(){let c=$("category").value;return c==="all"?Object.values(Q).flat():Q[c]}
function pick(n){if(waiting)return;chosen=n;let arr=pool();questions=arr;let q=arr[(n-1)%arr.length];$("question").textContent=q;$("respond").classList.remove("hidden");$("answer").value="";$("status").textContent="Answer this question. Your partner will see your answer.";conn?.send({t:"pick",n,q});waiting=true;for(let i=1;i<=20;i++)$("n"+i).classList.toggle("used",i===n)}
function sendAnswer(){let a=$("answer").value.trim();if(!a)return alert("Write an answer first.");$("answerBox").innerHTML="<b>You</b>"+escapeHtml(a);$("answerBox").classList.remove("hidden");$("respond").classList.add("hidden");$("status").textContent="Answer sent. Waiting for your partner's turn…";conn?.send({t:"answer",a,q:$("question").textContent,n:chosen});waiting=false}
function receive(m){if(m.t==="hello"){$("other").textContent=m.name;if(host){conn.send({t:"hello",name});$("status").textContent="Connected. Pick a number to begin."}}else if(m.t==="pick"){$("other").textContent=$("other").textContent||"Partner";$("question").textContent=m.q;$("answerBox").classList.add("hidden");$("respond").classList.remove("hidden");$("answer").value="";$("status").textContent="Your partner picked #"+m.n+". Answer it.";waiting=false}else if(m.t==="answer"){$("answerBox").innerHTML="<b>Partner's answer</b>"+escapeHtml(m.a);$("answerBox").classList.remove("hidden");$("respond").classList.add("hidden");$("question").textContent=m.q;$("status").textContent="They answered. Now you can pick a number.";waiting=false}}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function leave(){location.reload()}
$("category").addEventListener("change",()=>{if(!waiting)$("status").textContent="Category changed. Pick a number."})
</script></body></html>
